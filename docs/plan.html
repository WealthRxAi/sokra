<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080C">
<title>Your plan — Sokra</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,300&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./sokra.css">
</head>
<body>
<div class="wrap">
  <header><a class="logo" href="./">So<span>k</span>ra</a><nav class="nav"><a href="./">New bill</a><a href="./pricing.html">Pricing</a></nav></header>
  <div id="state" class="analyzing"><div class="ring"></div><div class="steps">Loading your plan…</div></div>
  <div id="results" class="hidden"></div>
  <footer><span>Sokra · LLCreativity LLC</span><span><a href="./privacy.html">Privacy</a> · <a href="./terms.html">Terms</a></span></footer>
</div>
<div class="toast" id="toast"></div>
<script src="./sokra.js"></script>
<script>
const { API, $, renderPlan } = SOKRA;
const id = new URLSearchParams(location.search).get("id") || (()=>{ try { return localStorage.getItem("sokra:last"); } catch { return null; } })();
(async () => {
  if (!id) { $("#state").innerHTML = `<div class="card"><b>No plan here.</b><p class="hint">Open the link from your email, or analyze a bill.</p><a class="btn ghost" href="./">Analyze a bill</a></div>`; return; }
  try {
    const qs = new URLSearchParams(location.search);
    const justPaid = qs.get("paid") === "1";
    const cs = qs.get("cs");
    // Coming back from Checkout: confirm with Stripe before loading the plan, so the
    // documents are already written by the time the page paints. Doesn't need a webhook.
    if (justPaid && cs) {
      try { await fetch(API + "/confirm", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, session_id: cs }) }); } catch {}
    }
    const [r, pr] = await Promise.all([fetch(API + "/case/" + id), fetch(API + "/pricing").then(x => x.json()).catch(() => ({}))]);
    const b = await r.json();
    if (!r.ok || !b.ok || !b.analysis) throw new Error(b.error || "Plan not found");
    try { localStorage.setItem("sokra:plan:" + id, JSON.stringify(b)); } catch {}
    const returning = !justPaid && !sessionStorage.getItem("sokra:fresh:" + id);
    try { sessionStorage.setItem("sokra:fresh:" + id, "1"); } catch {}
    // If Stripe redirected back but confirmation is still settling, treat as pro and let docs poll
    const tier = (b.tier === "pro" || justPaid) ? "pro" : "free";
    renderPlan($("#results"), b.analysis, b.id, { outcomeDone: b.outcome_reported_cents ?? null, tier, pricing: pr, returning });
    $("#state").classList.add("hidden"); $("#results").classList.remove("hidden");
    if (justPaid) { history.replaceState(null, "", "./plan.html?id=" + id); SOKRA.toast("Payment received — writing your documents"); setTimeout(() => $("#pro")?.scrollIntoView({ behavior: "smooth" }), 300); }
    else if (location.hash === "#outcome") setTimeout(() => $("#outcome")?.scrollIntoView({ behavior: "smooth" }), 200);
  } catch (e) {
    // offline fallback
    let cached = null; try { cached = JSON.parse(localStorage.getItem("sokra:plan:" + id) || "null"); } catch {}
    if (cached?.analysis) { renderPlan($("#results"), cached.analysis, cached.id, { outcomeDone: cached.outcome_reported_cents ?? null }); $("#state").classList.add("hidden"); $("#results").classList.remove("hidden"); return; }
    $("#state").innerHTML = `<div class="card"><b>${SOKRA.esc(e.message)}</b><p class="hint">Plans that were deleted can't be recovered.</p><a class="btn ghost" href="./">Analyze a bill</a></div>`;
  }
})();
</script>
</body>
</html>
